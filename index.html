<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trading Performance Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          <span>⚡</span> Performance Dashboard
        </h1>
        <p class="text-slate-400 text-sm mt-1">Live Execution & Trade Management Terminal</p>
      </div>
      <div id="mode-badge" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700">
        LOADING MODE...
      </div>
    </div>

    <!-- Edit Controls (Only visible in Edit Mode) -->
    <div id="edit-panel" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
      <h2 class="text-lg font-semibold text-amber-400 border-b border-slate-800 pb-2">➕ Log New Trade Entry</h2>
      
      <!-- Trade Input Form -->
      <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Date</label>
          <input type="date" id="trade-date" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-cyan-400">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Symbol</label>
          <input type="text" id="trade-symbol" placeholder="XAUUSD" value="XAUUSD" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-cyan-400">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Direction</label>
          <select id="trade-dir" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-cyan-400">
            <option value="LONG">LONG</option>
            <option value="SHORT">SHORT</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Risk ($)</label>
          <input type="number" id="trade-risk" placeholder="50.00" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-cyan-400">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">P&L ($)</label>
          <input type="number" id="trade-pnl" placeholder="150.00" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-cyan-400">
        </div>
      </div>

      <!-- Sync Credentials -->
      <div class="pt-2 border-t border-slate-800 grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
        <input type="password" id="gh-token" placeholder="Paste GitHub Personal Token to Sync Global Site" class="col-span-2 bg-slate-950 border border-slate-800 rounded p-2 text-xs text-slate-300">
        <button onclick="addAndSyncTrade()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2 px-4 rounded text-sm transition">
          Save & Publish to Live Site
        </button>
      </div>
      <p id="status-msg" class="text-xs text-slate-400 font-mono"></p>
    </div>

    <!-- Metrics Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <div class="text-xs text-slate-400">Starting Balance</div>
        <div class="text-xl font-bold text-white mt-1">$10,000.00</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <div class="text-xs text-slate-400">Current Balance</div>
        <div id="stat-balance" class="text-xl font-bold text-emerald-400 mt-1">$10,000.00</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <div class="text-xs text-slate-400">Win Rate</div>
        <div id="stat-winrate" class="text-xl font-bold text-cyan-400 mt-1">0.0%</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <div class="text-xs text-slate-400">Total Net P&L</div>
        <div id="stat-pnl" class="text-xl font-bold text-emerald-400 mt-1">+$0.00</div>
      </div>
    </div>

    <!-- Execution Log Table -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 font-semibold text-slate-200">
        📊 Execution Log
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-950 text-xs text-slate-500 uppercase">
            <tr>
              <th class="p-3">Date</th>
              <th class="p-3">Symbol</th>
              <th class="p-3">Direction</th>
              <th class="p-3">Risk ($)</th>
              <th class="p-3 text-right">P&L ($)</th>
            </tr>
          </thead>
          <tbody id="trade-rows" class="divide-y divide-slate-800">
            <!-- Dynamic rows will load here -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // --- MASTER DATABASE ARRAY ---
    // Editing this array or saving via token updates the global default site data
    let tradeData = [
      { date: "2026-09-20", symbol: "XAUUSD", dir: "LONG", risk: 50.00, pnl: -50.30 },
      { date: "2026-09-21", symbol: "XAUUSD", dir: "LONG", risk: 50.00, pnl: 199.40 },
      { date: "2026-09-22", symbol: "XAUUSD", dir: "SHORT", risk: 50.00, pnl: -50.30 },
      { date: "2026-09-23", symbol: "EURUSD", dir: "LONG", risk: 50.00, pnl: 4.70 },
      { date: "2026-09-25", symbol: "XAUUSD", dir: "LONG", risk: 50.00, pnl: 80.00 }
    ];

    // Check mode parameter (?mode=edit vs ?mode=view)
    const urlParams = new URLSearchParams(window.location.search);
    const isEditMode = urlParams.get('mode') === 'edit';

    // UI Setup
    const modeBadge = document.getElementById('mode-badge');
    const editPanel = document.getElementById('edit-panel');

    if (isEditMode) {
      modeBadge.textContent = '✏️ EDIT MODE';
      modeBadge.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/30';
      editPanel.classList.remove('hidden');
    } else {
      modeBadge.textContent = '👁️ VIEW-ONLY MODE';
      modeBadge.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30';
    }

    function renderDashboard() {
      const tbody = document.getElementById('trade-rows');
      tbody.innerHTML = '';

      let totalPnl = 0;
      let wins = 0;

      tradeData.forEach(t => {
        totalPnl += t.pnl;
        if (t.pnl > 0) wins++;

        const pnlClass = t.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400';
        const pnlFormatted = (t.pnl >= 0 ? '+' : '') + `$${t.pnl.toFixed(2)}`;
        const dirClass = t.dir === 'LONG' ? 'text-emerald-400' : 'text-rose-400';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-800/50">
            <td class="p-3 font-mono">${t.date}</td>
            <td class="p-3 font-bold text-white">${t.symbol}</td>
            <td class="p-3 font-semibold ${dirClass}">${t.dir}</td>
            <td class="p-3 font-mono text-slate-400">$${t.risk.toFixed(2)}</td>
            <td class="p-3 font-mono font-bold text-right ${pnlClass}">${pnlFormatted}</td>
          </tr>
        `;
      });

      // Update metrics
      const startingBalance = 10000;
      const currentBalance = startingBalance + totalPnl;
      const winRate = tradeData.length ? ((wins / tradeData.length) * 100).toFixed(1) : '0.0';

      document.getElementById('stat-balance').textContent = `$${currentBalance.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
      document.getElementById('stat-winrate').textContent = `${winRate}%`;
      
      const pnlElement = document.getElementById('stat-pnl');
      pnlElement.textContent = (totalPnl >= 0 ? '+' : '') + `$${totalPnl.toFixed(2)}`;
      pnlElement.className = `text-xl font-bold mt-1 ${totalPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
    }

    // Local render on start
    renderDashboard();

    // --- OPTIONAL: GITHUB API PUBLISH FUNCTION ---
    async function addAndSyncTrade() {
      const date = document.getElementById('trade-date').value;
      const symbol = document.getElementById('trade-symbol').value;
      const dir = document.getElementById('trade-dir').value;
      const risk = parseFloat(document.getElementById('trade-risk').value);
      const pnl = parseFloat(document.getElementById('trade-pnl').value);
      const token = document.getElementById('gh-token').value;
      const statusMsg = document.getElementById('status-msg');

      if (!date || !symbol || isNaN(risk) || isNaN(pnl)) {
        alert('Please fill out all trade inputs correctly.');
        return;
      }

      // 1. Add trade locally
      const newTrade = { date, symbol, dir, risk, pnl };
      tradeData.unshift(newTrade);
      renderDashboard();

      // 2. If token provided, commit directly to GitHub repository
      if (!token) {
        statusMsg.textContent = "Saved locally on this device. Paste a GitHub PAT to sync globally to all viewers.";
        statusMsg.className = "text-xs text-amber-400 font-mono";
        return;
      }

      statusMsg.textContent = "Syncing with GitHub repository...";
      statusMsg.className = "text-xs text-cyan-400 font-mono";

      try {
        // Fetch repo info from current URL
        const pathParts = window.location.pathname.split('/').filter(p => p);
        const repoOwner = window.location.hostname.split('.')[0];
        const repoName = pathParts[0];

        const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/index.html`;

        // Get current file sha
        const getRes = await fetch(apiUrl, {
          headers: { Authorization: `bearer ${token}` }
        });
        const getData = await getRes.json();

        // Update script content
        let currentCode = decodeURIComponent(escape(atob(getData.content)));
        const updatedArrayString = `let tradeData = ${JSON.stringify(tradeData, null, 2)};`;
        const updatedCode = currentCode.replace(/let tradeData = \[[\s\S]*?\];/, updatedArrayString);

        // Put request to GitHub
        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            Authorization: `bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Log trade entry: ${symbol} ${dir}`,
            content: btoa(unescape(encodeURIComponent(updatedCode))),
            sha: getData.sha
          })
        });

        if (putRes.ok) {
          statusMsg.textContent = "✅ Successfully published to live website! Rebuilding in ~30s.";
          statusMsg.className = "text-xs text-emerald-400 font-mono";
        } else {
          statusMsg.textContent = "❌ Sync failed. Verify GitHub token permissions.";
          statusMsg.className = "text-xs text-rose-400 font-mono";
        }
      } catch (err) {
        statusMsg.textContent = "❌ Connection error: " + err.message;
        statusMsg.className = "text-xs text-rose-400 font-mono";
      }
    }
  </script>
</body>
</html>
